<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>中1 2学期テスト対策 ガチンコ100問</title>
<style>
:root{
  --bg:#fff8ef; --ink:#2b2b3a; --sub:#6b6b7b; --card:#ffffff; --line:#eadfce;
  --koku:#e0527a; --suu:#3b7ddd; --ei:#f29a1f; --sha:#2fa36b; --ri:#8a5cd6;
  --ok:#22a55a; --ng:#e04848;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
.app{max-width:480px;margin:0 auto;padding:14px 14px 40px;min-height:100vh}
h1{font-size:22px;margin:6px 0 4px;text-align:center}
.lead{text-align:center;color:var(--sub);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 0 var(--line);border:1px solid var(--line);margin-bottom:12px}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px 12px;font-size:17px;font-weight:700;
  font-family:inherit;cursor:pointer;color:#fff;background:var(--ink);margin-top:10px}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn:active{transform:scale(.98)}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{border:3px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;background:#fff;cursor:pointer}
.pl.sel{border-color:var(--ei);background:#fff3e0}
.pl .em{font-size:34px}
.pl input{width:100%;border:none;border-bottom:2px dashed var(--line);text-align:center;font-size:16px;font-family:inherit;
  padding:4px;background:transparent;color:var(--ink);font-weight:700}
.pl .best{font-size:12px;color:var(--sub);margin-top:4px}
.subjects{display:flex;justify-content:space-between;gap:6px;margin-top:6px}
.sj{flex:1;text-align:center;border-radius:12px;padding:8px 0;color:#fff;font-weight:700;font-size:14px}
.rule{font-size:13px;color:var(--sub);line-height:1.7;margin:8px 0 0;padding-left:18px}
/* quiz */
.top{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:6px}
.score{font-weight:800;color:var(--ink);font-size:15px}
.bar{height:10px;background:#efe6d8;border-radius:10px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--koku),var(--suu),var(--ei),var(--sha),var(--ri));transition:width .4s}
.tag{display:inline-block;color:#fff;font-weight:800;border-radius:10px;padding:4px 10px;font-size:13px}
.stars{color:#f5b400;font-size:14px;margin-left:6px;letter-spacing:1px}
.qno{float:right;color:var(--sub);font-size:13px;margin-top:4px}
.q{font-size:18px;line-height:1.65;margin:12px 0 4px;font-weight:700;white-space:pre-line}
.blank{display:inline-block;min-width:3em;border-bottom:3px solid var(--ink);text-align:center;color:var(--ei)}
.opts{display:grid;gap:9px;margin-top:12px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 12px;font-size:17px;font-family:inherit;
  text-align:left;color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center;min-height:54px}
.opt b{display:inline-flex;width:28px;height:28px;border-radius:50%;background:#f3ece1;align-items:center;justify-content:center;font-size:14px;flex:none}
.opt.ok{border-color:var(--ok);background:#e8f8ee}
.opt.ng{border-color:var(--ng);background:#fdeaea}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.hint{margin-top:10px;font-size:14px;background:#fffbe6;border:2px dashed #f2d36b;border-radius:12px;padding:10px;display:none}
.hintbtn{background:none;border:2px solid #f2d36b;color:#9a7a00;border-radius:12px;padding:9px 12px;font-family:inherit;font-weight:700;font-size:14px;margin-top:12px;width:100%;cursor:pointer}
.fb{margin-top:12px;border-radius:14px;padding:12px;font-size:15px;line-height:1.7;display:none}
.fb.ok{background:#e8f8ee;border:2px solid var(--ok)}
.fb.ng{background:#fdeaea;border:2px solid var(--ng)}
.fb h3{margin:0 0 4px;font-size:18px}
/* order */
.slots{min-height:58px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;background:#fffdf8}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tile{border:2px solid var(--ei);background:#fff;color:var(--ink);border-radius:12px;padding:10px 12px;font-size:17px;font-family:inherit;font-weight:700;cursor:pointer}
.tile.used{visibility:hidden}
.slots .tile{background:#fff3e0}
.combo{position:fixed;left:50%;top:35%;transform:translate(-50%,-50%) scale(.6);font-size:30px;font-weight:900;color:var(--ei);
  text-shadow:0 3px 0 #fff;opacity:0;pointer-events:none;transition:all .35s}
.combo.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* stage */
.stage{text-align:center;padding:30px 16px}
.stage .big{font-size:56px}
.stage h2{margin:6px 0;font-size:26px}
/* result */
.total{text-align:center}
.total .pt{font-size:64px;font-weight:900;line-height:1}
.total .pt small{font-size:22px}
.rank{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:20px;background:#fff3e0;font-weight:800}
.row{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:14px}
.row .nm{width:44px;font-weight:800}
.row .bg{flex:1;height:16px;background:#efe6d8;border-radius:10px;overflow:hidden}
.row .bg i{display:block;height:100%}
.row .v{width:52px;text-align:right;font-weight:800}
.rev{font-size:14px;line-height:1.7;border-top:1px solid var(--line);padding:10px 0}
.rev:first-child{border-top:none}
.muted{color:var(--sub);font-size:12px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mode{border:none;border-radius:14px;padding:12px 6px;color:#fff;font-weight:800;font-size:15px;font-family:inherit;cursor:pointer}
.mode small{display:block;font-weight:600;font-size:11px;opacity:.9}
.quit{background:none;border:none;color:var(--sub);font-family:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:0}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="combo" id="combo"></div>
<script>
const SUBJ = [
  {key:"koku", name:"国語", emoji:"📖", color:"var(--koku)"},
  {key:"suu",  name:"数学", emoji:"🔢", color:"var(--suu)"},
  {key:"ei",   name:"英語", emoji:"🔤", color:"var(--ei)"},
  {key:"sha",  name:"社会", emoji:"🌏", color:"var(--sha)"},
  {key:"ri",   name:"理科", emoji:"🧪", color:"var(--ri)"},
];
const Q = {
koku:[
 {lv:1,q:"読みはどれ？\n戦争中、子どもたちは田舎へ［疎開］した。",o:["そかい","そうかい","そけい","しょかい"],a:0,h:"「疎」は「そ」と読むよ。",e:"疎開（そかい）＝空襲などをさけるため、都市から地方へ移ること。"},
 {lv:1,q:"読みはどれ？\nこれは［貴重］な資料だ。",o:["きちょう","きじゅう","きぢょう","たかちょう"],a:0,h:"「重」は「ちょう」とも読むよ（例：慎重）。",e:"貴重（きちょう）＝とても大切なこと。"},
 {lv:1,q:"カタカナを漢字にすると？\n意見の［コンキョ］を示す。",o:["根拠","根挙","恨拠","根処"],a:0,h:"「根」っこになる「よりどころ」。",e:"根拠＝考えや意見のよりどころ。「拠」は「よりどころ」の意味。"},
 {lv:3,q:"カタカナを漢字にすると？\n混乱した事態を［シュウシュウ］する。",o:["収拾","収集","収縮","修習"],a:0,h:"「切手をシュウシュウする」とはちがう漢字だよ。",e:"収拾＝混乱をおさめること。収集＝物を集めること（切手の収集）。同音異義語に注意！"},
 {lv:1,q:"「目を丸くする」の意味は？",o:["おどろく","よく見る","ねむくなる","おこる"],a:0,h:"びっくりしたときの表情。",e:"目を大きく見開くようすから「おどろく」という意味。"},
 {lv:2,q:"「口がすべる」の意味は？",o:["うっかり言ってはいけないことを言う","話が上手である","食べすぎる","だまっている"],a:0,h:"言うつもりがなかったのに…",e:"「口がすべる」＝うっかり言ってはいけないことを言ってしまう。"},
 {lv:2,q:"「肯定」の対義語は？",o:["否定","決定","安定","仮定"],a:0,h:"「そうだ」と認める ↔ 「そうではない」と打ち消す。",e:"肯定 ↔ 否定。"},
 {lv:2,q:"「方法」の類義語は？",o:["手段","目的","結果","原因"],a:0,h:"「やり方」という意味に近いもの。",e:"方法≒手段。どちらも目的を果たすためのやり方。"},
 {lv:3,q:"「豊富」と同じ組み立ての熟語は？",o:["岩石","前後","着席","新年"],a:0,h:"「豊」も「富」も「ゆたか」。似た意味の字の組み合わせ。",e:"豊富・岩石は似た意味の字の組み合わせ。前後＝反対の意味、着席＝席に着く（目的）、新年＝新しい年（修飾）。"},
 {lv:1,q:"「太陽がほほえんでいる。」に使われている表現技法は？",o:["擬人法","直喩","倒置","体言止め"],a:0,h:"太陽は人間ではないのに…",e:"人でないものを人のように表すのが擬人法。"},
 {lv:1,q:"「まるで宝石のような星」に使われている表現技法は？",o:["直喩（明喩）","隠喩（暗喩）","擬人法","反復"],a:0,h:"「まるで」「ような」がポイント。",e:"「まるで〜のような」を使ってたとえるのが直喩。使わずに「星は宝石だ」とたとえるのが隠喩。"},
 {lv:2,q:"「行こう、未来へ。」に使われている表現技法は？",o:["倒置","体言止め","擬人法","対句"],a:0,h:"ふつうの順番に直すと「未来へ行こう。」",e:"語順を入れかえて強調するのが倒置。"},
 {lv:2,q:"「夜空にかがやく満月。」に使われている表現技法は？",o:["体言止め","倒置","直喩","反復"],a:0,h:"文の最後の言葉に注目！",e:"文末を名詞（体言）で止めて余韻を残すのが体言止め。"},
 {lv:1,q:"次の文はいくつの文節に分けられる？\n私は毎朝牛乳を飲む。",o:["4つ","3つ","5つ","6つ"],a:0,h:"「ネ」を入れてみよう。私はネ…",e:"私は／毎朝／牛乳を／飲む　の4文節。"},
 {lv:2,q:"次の文の主語は？\nこの町にも、ついに春が来た。",o:["春が","町にも","ついに","来た"],a:0,h:"「何が」来たのかな？",e:"「何が─来た」→「春が」が主語。「町にも」は「が」ではないので主語ではない。"},
 {lv:2,q:"次の文の述語は？\n弟はとても元気な小学生だ。",o:["小学生だ","元気な","とても","弟は"],a:0,h:"「弟は─どうだ・何だ」",e:"「弟は─小学生だ」で、述語は文の最後の「小学生だ」。"},
 {lv:3,q:"「赤くて丸いりんご」の「赤くて」と「丸い」の関係は？",o:["並立の関係","補助の関係","修飾・被修飾の関係","主・述の関係"],a:0,h:"入れかえて「丸くて赤いりんご」にしても意味は同じ？",e:"対等に並び、入れかえても意味が変わらないのが並立の関係。"},
 {lv:2,q:"次の文の「暑かったので」は、文の成分では何？\n暑かったので、窓を開けた。",o:["接続語","修飾語","独立語","主語"],a:0,h:"理由を表して、あとの部分につないでいるね。",e:"理由や条件を示してあとにつなぐのは接続語。"},
 {lv:2,q:"「星の花が降るころに」の作者は？",o:["安東みきえ","米倉斉加年","ヘルマン・ヘッセ","工藤直子"],a:0,h:"「大人になれなかった弟たちに……」の作者ではないよ。",e:"「星の花が降るころに」は安東みきえ。「大人になれなかった弟たちに……」は米倉斉加年、「少年の日の思い出」はヘッセ。"},
 {lv:3,q:"「大人になれなかった弟たちに……」の時代背景は？",o:["太平洋戦争中","明治時代","関東大震災のころ","高度経済成長期"],a:0,h:"疎開・配給・空襲が出てくるよ。",e:"太平洋戦争中、食べ物が不足する中での家族（弟ヒロユキ）の話。"},
],
suu:[
 {lv:1,q:"計算しよう。\n−5 + 8",o:["3","−3","13","−13"],a:0,h:"絶対値の大きい方の符号になるよ。",e:"8 − 5 ＝ 3、符号は＋。"},
 {lv:1,q:"計算しよう。\n(−7) − (−3)",o:["−4","−10","4","10"],a:0,h:"−(−3) は ＋3",e:"−7 ＋ 3 ＝ −4"},
 {lv:2,q:"計算しよう。\n(−2) × (−3) × (−4)",o:["−24","24","−9","9"],a:0,h:"負の数が3個（奇数個）だと符号は？",e:"負の数が奇数個なので答えは −。2×3×4＝24 → −24"},
 {lv:2,q:"計算しよう。\n−2² + (−3)²",o:["5","13","−13","−5"],a:0,h:"−2²＝−4、(−3)²＝9",e:"−4 ＋ 9 ＝ 5"},
 {lv:3,q:"計算しよう。\n(−3)² − 2 × (−5) ÷ (−10)",o:["8","10","−8","1"],a:0,h:"かけ算・わり算を先に！ 2×(−5)÷(−10) はいくつ？",e:"9 − {2×(−5)÷(−10)} ＝ 9 − 1 ＝ 8"},
 {lv:2,q:"90を素因数分解すると？",o:["2 × 3² × 5","2 × 45","9 × 10","2 × 3 × 15"],a:0,h:"素数（2, 3, 5…）だけの積にするよ。",e:"90 ＝ 2 × 3 × 3 × 5 ＝ 2 × 3² × 5。45や15は素数ではない。"},
 {lv:1,q:"次の式を×を使わずに表すと？\na × a × b",o:["a²b","2ab","aab","a + a + b"],a:0,h:"同じ文字のかけ算は指数を使う。",e:"a × a ＝ a²、それに b をかけて a²b。"},
 {lv:2,q:"次の式を×や÷を使わずに表すと？\na × (−1) ÷ b",o:["−a/b","−1a/b","a/−b","−ab"],a:0,h:"「1」は書かないのがルール。",e:"a×(−1)＝−a。それを b でわって −a/b。−1a とは書かない。"},
 {lv:1,q:"50円切手 x 枚と、80円切手 y 枚の代金の合計は？",o:["50x + 80y 円","130xy 円","50y + 80x 円","4000xy 円"],a:0,h:"それぞれの代金をたそう。",e:"50×x ＋ 80×y ＝ 50x ＋ 80y（円）"},
 {lv:2,q:"a = −3 のとき、a² + 2a の値は？",o:["3","15","−15","−3"],a:0,h:"(−3)² ＋ 2×(−3)",e:"9 ＋ (−6) ＝ 3"},
 {lv:2,q:"計算しよう。\n4x − 3 − (2x − 5)",o:["2x + 2","2x − 8","6x − 8","2x − 2"],a:0,h:"−( ) をはずすと符号が変わる：−2x ＋ 5",e:"4x − 3 − 2x ＋ 5 ＝ 2x ＋ 2"},
 {lv:3,q:"計算しよう。\n3(2a − 1) − 2(a − 4)",o:["4a + 5","4a − 11","4a − 5","8a + 5"],a:0,h:"−2(a − 4) ＝ −2a ＋ 8",e:"6a − 3 − 2a ＋ 8 ＝ 4a ＋ 5"},
 {lv:3,q:"「1個 a 円のケーキ5個の代金は、1000円より高い」を式で表すと？",o:["5a > 1000","5a < 1000","5a ≧ 1000","a + 5 > 1000"],a:0,h:"「より高い」は「＞」。1000円ちょうどはふくまない。",e:"代金 5a が 1000 より大きいので 5a ＞ 1000。「以上」なら ≧ を使う。"},
 {lv:1,q:"方程式を解こう。\n4x = −20",o:["x = −5","x = 5","x = −16","x = −80"],a:0,h:"両辺を4でわろう。",e:"x ＝ −20 ÷ 4 ＝ −5"},
 {lv:2,q:"1冊120円のノートを何冊かと、200円の筆箱を1つ買ったら、代金は920円だった。ノートは何冊？",o:["6冊","5冊","7冊","8冊"],a:0,h:"ノートを x 冊として、120x ＋ 200 ＝ 920",e:"120x ＝ 720 → x ＝ 6（冊）"},
 {lv:2,q:"方程式を解こう。\n5x + 3 = 2x − 9",o:["x = −4","x = 4","x = −2","x = 2"],a:0,h:"x は左辺、数は右辺へ移項。",e:"5x − 2x ＝ −9 − 3 → 3x ＝ −12 → x ＝ −4"},
 {lv:2,q:"方程式を解こう。\n3(x + 2) = x − 4",o:["x = −5","x = 5","x = −1","x = −3"],a:0,h:"かっこをはずすと 3x ＋ 6 ＝ x − 4",e:"3x − x ＝ −4 − 6 → 2x ＝ −10 → x ＝ −5"},
 {lv:3,q:"方程式を解こう。\n0.3x − 1.2 = 0.1x + 0.4",o:["x = 8","x = 0.8","x = 4","x = −8"],a:0,h:"両辺を10倍して小数をなくそう。",e:"3x − 12 ＝ x ＋ 4 → 2x ＝ 16 → x ＝ 8"},
 {lv:3,q:"方程式を解こう。\n(x − 1)/2 = (x + 3)/4",o:["x = 5","x = 1","x = −5","x = 7"],a:0,h:"両辺に4をかけると 2(x − 1) ＝ x ＋ 3",e:"2x − 2 ＝ x ＋ 3 → x ＝ 5"},
 {lv:3,q:"x = 2 が、方程式 ax + 4 = 10 の解であるとき、a の値は？",o:["3","6","7","−3"],a:0,h:"x に 2 を代入して、a の方程式にしよう。",e:"2a ＋ 4 ＝ 10 → 2a ＝ 6 → a ＝ 3"},
],
ei:[
 {lv:1,q:"（　）に入る語は？\nI (  ) from Yokohama.",o:["am","is","are","do"],a:0,h:"主語は I。",e:"I am from ～.＝「私は～出身です」。"},
 {lv:1,q:"（　）に入る語は？\nYou (  ) a good singer.",o:["are","am","is","be"],a:0,h:"主語は You。",e:"You のときの be動詞は are。"},
 {lv:1,q:"（　）に入る語は？\n(  ) you a student? — Yes, I am.",o:["Are","Do","Is","Am"],a:0,h:"答えが \"I am\" になっているね。",e:"be動詞の疑問文は be動詞を前に出す。Are you ～? — Yes, I am."},
 {lv:2,q:"「私は納豆が好きではありません」\nI (  ) like natto.",o:["don't","am not","not","isn't"],a:0,h:"like は一般動詞。",e:"一般動詞の否定文は don't＋動詞。am not は使わない。"},
 {lv:1,q:"（　）に入る語は？\n(  ) you play the piano? — Yes, I do.",o:["Do","Are","Can","Is"],a:0,h:"答えに do があるよ。",e:"一般動詞の疑問文は Do で始める。"},
 {lv:2,q:"（　）に入る語は？\nCan you ski? — No, I (  ).",o:["can't","don't","am not","can"],a:0,h:"Can で聞かれて「いいえ」。",e:"Can ～? には can / can't で答える。No, I can't."},
 {lv:2,q:"（　）に入る語は？\nI can (  ) English well.",o:["speak","speaks","speaking","to speak"],a:0,h:"can のあとの動詞の形は？",e:"can のあとは動詞の原形。"},
 {lv:1,q:"（　）に入る語は？\nThis is Ms. Kato. (  ) is a music teacher.",o:["She","He","It","They"],a:0,h:"Ms. は女性につけるよ。",e:"女性を受けるのは She。"},
 {lv:2,q:"（　）に入る語は？\nWhere is my bag? — (  ) is under the desk.",o:["It","He","This","That"],a:0,h:"「それは」机の下にあるよ。",e:"物を受けるのは It。"},

const PLAYER_EMOJI=["🦊","🐼"];
let S={player:0,names:["ふうちゃん","プレイヤー2"],mode:"all",list:[],idx:0,score:0,log:[],combo:0,hintUsed:false,answered:false,orderPick:[]};
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
(function(){const n=store("q2_names");if(n&&n.length===2)S.names=n;})();
const $=s=>document.getElementById(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const stars=n=>"★".repeat(n)+"☆".repeat(3-n);
const fmt=v=>Number.isInteger(v)?String(v):v.toFixed(1);
const modeName=m=>m==="all"?"5教科100問":SUBJ.find(s=>s.key===m).name+"20問";
const bestKey=(p,m)=>"q2_best_"+p+"_"+m;

function home(){
  const b=bestKey(S.player,"all"),bv=store(b);
  $("app").innerHTML=`
  <h1>🔥 中1 2学期テスト対策<br>ガチンコ100問</h1>
  <p class="lead">11月2日までの授業範囲・5教科×20問<br>（横浜市の教科書に対応）</p>
  <div class="card">
    <div style="font-weight:800;margin-bottom:8px">だれがやる？（名前はタップで変えられるよ）</div>
    <div class="players">
      ${[0,1].map(i=>{const v=store(bestKey(i,"all"));return `<div class="pl ${S.player===i?"sel":""}" onclick="pick(${i})">
        <div class="em">${PLAYER_EMOJI[i]}</div>
        <input value="${esc(S.names[i])}" maxlength="8" onclick="event.stopPropagation();pick(${i},true)" oninput="rename(${i},this.value)">
        <div class="best">${v==null?"100問：記録なし":"100問ベスト "+fmt(v)+"点"}</div></div>`}).join("")}
    </div>
  </div>
  <div class="card">
    <button class="btn" style="background:linear-gradient(90deg,var(--koku),var(--ri));margin-top:0" onclick="start('all')">🏆 5教科100問に挑戦（100点満点）</button>
    <div style="font-weight:800;margin:14px 0 0;font-size:14px">教科ごとに練習（各20問・20点満点）</div>
    <div class="modes">
      ${SUBJ.map(s=>{const v=store(bestKey(S.player,s.key));return `<button class="mode" style="background:${s.color}" onclick="start('${s.key}')">${s.emoji} ${s.name}<small>${v==null?"記録なし":"ベスト "+fmt(v)+"点"}</small></button>`}).join("")}
    </div>
    <ul class="rule">
      <li>1問1点。100問で100点満点</li>
      <li>難しさは ★☆☆〜★★★</li>
      <li>💡ヒントを見て正解すると 0.5点</li>
      <li>連続正解でコンボ！</li>
    </ul>
  </div>`;
}
function pick(i,keep){S.player=i;if(!keep)home();else document.querySelectorAll(".pl").forEach((e,j)=>e.classList.toggle("sel",j===i))}
function rename(i,v){S.names[i]=v.trim()||(i===0?"ふうちゃん":"プレイヤー2");store("q2_names",S.names)}

function start(mode){
  S.mode=mode;S.list=[];
  const subs=mode==="all"?SUBJ:SUBJ.filter(s=>s.key===mode);
  subs.forEach(s=>{
    const qs=shuffle(Q[s.key]).sort((a,b)=>a.lv-b.lv);
    qs.forEach(q=>S.list.push({...q,subj:s}));
  });
  S.idx=0;S.score=0;S.log=[];S.combo=0;
  stage();
}
function stage(){
  const q=S.list[S.idx];
  const st=S.mode==="all"?`<div class="muted">ステージ ${SUBJ.indexOf(q.subj)+1} / 5</div>`:"";
  $("app").innerHTML=`<div class="card stage">
    <div class="big">${q.subj.emoji}</div>${st}
    <h2 style="color:${q.subj.color}">${q.subj.name} 20問</h2>
    <div class="muted">いまの得点：${fmt(S.score)}点</div>
    <button class="btn" style="background:${q.subj.color}" onclick="show()">はじめる</button></div>`;
}
function quit(){
  const box=$("quitbox");if(box){box.style.display=box.style.display==="block"?"none":"block"}
}
function show(){
  const q=S.list[S.idx];S.hintUsed=false;S.answered=false;S.orderPick=[];
  const n=(S.idx%20)+1;
  let body="";
  if(q.type==="o"){
    q._pool=shuffle(q.t.map((w,i)=>({w,i})));
    body=`<div class="slots" id="slots"></div>
      <div class="pool" id="pool">${q._pool.map((p,k)=>`<button class="tile" id="t${k}" onclick="tapTile(${k})">${esc(p.w)}</button>`).join("")}</div>
      <div style="display:flex;gap:8px"><button class="btn ghost" onclick="resetOrder()">やり直す</button>
      <button class="btn" style="background:${q.subj.color}" onclick="checkOrder()">決定</button></div>`;
  }else{
    q._ord=shuffle(q.o.map((t,i)=>i));
    body=`<div class="opts">${q._ord.map((oi,k)=>`<button class="opt" id="o${k}" onclick="answer(${k})"><b>${"ABCD"[k]}</b><span>${esc(q.o[oi])}</span></button>`).join("")}</div>`;
  }
  $("app").innerHTML=`
  <div class="top"><span>${esc(S.names[S.player])}・${modeName(S.mode)}　<button class="quit" onclick="quit()">中断</button></span><span class="score">${fmt(S.score)}点</span></div>
  <div class="card" id="quitbox" style="display:none;text-align:center">ここでやめる？（記録は残りません）
    <div style="display:flex;gap:8px"><button class="btn ghost" onclick="quit()">続ける</button><button class="btn" onclick="home()">やめる</button></div></div>
  <div class="bar"><i style="width:${S.idx/S.list.length*100}%"></i></div>
  <div class="card">
    <span class="tag" style="background:${q.subj.color}">${q.subj.name}</span><span class="stars">${stars(q.lv)}</span>
    <span class="qno">${n} / 20</span>
    <div class="q">${esc(q.q).replace(/\(  \)/g,'<span class="blank">？</span>')}</div>
    ${body}
    <button class="hintbtn" id="hb" onclick="hint()">💡 ヒントを見る（正解で0.5点になるよ）</button>
    <div class="hint" id="hint">💡 ${esc(q.h)}</div>
    <div class="fb" id="fb"></div>
  </div>`;
  if(q.type==="o")renderSlots(q);
  window.scrollTo(0,0);
}
function hint(){if(S.answered)return;S.hintUsed=true;$("hint").style.display="block";$("hb").style.display="none"}
function tapTile(k){if(S.answered)return;S.orderPick.push(k);$("t"+k).classList.add("used");renderSlots(S.list[S.idx])}
function renderSlots(q){
  $("slots").innerHTML=S.orderPick.length?S.orderPick.map((k,pos)=>`<button class="tile" onclick="untap(${pos})">${esc(q._pool[k].w)}</button>`).join(""):
   `<span class="muted" style="padding:8px">↓ 下の単語をタップして並べてね</span>`;
}
function untap(pos){if(S.answered)return;const k=S.orderPick.splice(pos,1)[0];$("t"+k).classList.remove("used");renderSlots(S.list[S.idx])}
function resetOrder(){if(S.answered)return;S.orderPick.forEach(k=>$("t"+k).classList.remove("used"));S.orderPick=[];renderSlots(S.list[S.idx])}
function checkOrder(){
  const q=S.list[S.idx];if(S.answered)return;
  if(S.orderPick.length<q.t.length){$("slots").style.borderColor="var(--ng)";setTimeout(()=>{const e=$("slots");if(e)e.style.borderColor=""},500);return}
  finish(S.orderPick.map(k=>q._pool[k].w).join(" ")===q.t.join(" "),q.t.join(" "));
}
function answer(k){
  if(S.answered)return;const q=S.list[S.idx];const ok=q._ord[k]===q.a;
  q._ord.forEach((oi,j)=>{const b=$("o"+j);b.disabled=true;if(oi===q.a)b.classList.add("ok");else if(j===k)b.classList.add("ng");else b.classList.add("dim")});
  finish(ok,q.o[q.a]);
}
function finish(ok,ans){
  const q=S.list[S.idx];S.answered=true;
  const pt=ok?(S.hintUsed?0.5:1):0;S.score+=pt;S.combo=ok?S.combo+1:0;
  S.log.push({q,ok,pt,ans});
  if(S.combo>=3&&S.combo%5===0)pop(S.combo+" コンボ！🔥🔥");else if(S.combo>=3)pop(S.combo+" コンボ！🔥");else if(ok&&q.lv===3)pop("むずかしい問題クリア！✨");
  $("hb").style.display="none";
  const last=S.idx===S.list.length-1;
  const f=$("fb");f.className="fb "+(ok?"ok":"ng");f.style.display="block";
  f.innerHTML=`<h3>${ok?"⭕ 正解！ +"+fmt(pt)+"点":"❌ ざんねん…"}</h3>
   ${ok?"":`<div>答え：<b>${esc(ans)}</b></div>`}
   <div>${esc(q.e)}</div>
   <button class="btn" style="background:${q.subj.color}" onclick="next()">${last?"結果を見る 🎉":"次へ ▶"}</button>`;
  document.querySelector(".top .score").textContent=fmt(S.score)+"点";
  setTimeout(()=>f.scrollIntoView({behavior:"smooth",block:"nearest"}),50);
}
function pop(t){const c=$("combo");c.textContent=t;c.classList.add("show");setTimeout(()=>c.classList.remove("show"),1100)}
function next(){S.idx++;if(S.idx>=S.list.length)return result();if(S.idx%20===0)stage();else show()}

function result(){
  const sc=S.score,full=S.list.length,pct=sc/full*100;
  const rank=pct===100?"👑 パーフェクト！テスト満点まちがいなし":pct>=85?"🥇 学年トップクラス！":pct>=70?"🥈 かなりデキる！":pct>=50?"🥉 いい調子！あと一歩":"🌱 のびしろたっぷり！もう一回！";
  const bk=bestKey(S.player,S.mode),prev=store(bk);const isBest=prev==null||sc>prev;if(isBest)store(bk,sc);
  const subs=S.mode==="all"?SUBJ:SUBJ.filter(s=>s.key===S.mode);
  const per=subs.map(s=>({s,v:S.log.filter(l=>l.q.subj===s).reduce((a,l)=>a+l.pt,0)}));
  const wrong=S.log.filter(l=>!l.ok);
  $("app").innerHTML=`
  <div class="card total">
    <div class="muted">${esc(S.names[S.player])}・${modeName(S.mode)} の結果</div>
    <div class="pt">${fmt(sc)}<small>点 / ${full}</small></div>
    <div class="rank">${rank}</div>
    ${isBest&&prev!=null?`<div style="margin-top:8px;font-weight:800;color:var(--ei)">🎊 ベスト更新！（前回 ${fmt(prev)}点）</div>`:""}
  </div>
  <div class="card">
    <div style="font-weight:800;margin-bottom:4px">教科別（各20点）</div>
    ${per.map(p=>`<div class="row"><span class="nm" style="color:${p.s.color}">${p.s.name}</span>
      <span class="bg"><i style="width:${p.v/20*100}%;background:${p.s.color}"></i></span><span class="v">${fmt(p.v)}/20</span></div>`).join("")}
  </div>
  <a class="btn" id="linebtn" style="background:#06c755;text-align:center;text-decoration:none" target="_blank" rel="noopener">📩 結果をLINEで送る</a>
  <div class="card" style="margin-top:12px">
    <div style="font-weight:800;margin-bottom:4px">${wrong.length?"🔁 まちがえた問題をふり返ろう（"+wrong.length+"問）":"🎯 全問正解！すごい！"}</div>
    ${wrong.map(l=>`<div class="rev"><span class="tag" style="background:${l.q.subj.color};font-size:11px">${l.q.subj.name}</span>
      <div style="white-space:pre-line;margin-top:4px">${esc(l.q.q)}</div>
      <div>答え：<b>${esc(l.ans)}</b></div><div class="muted" style="font-size:13px">${esc(l.q.e)}</div></div>`).join("")}
  </div>
  <button class="btn" onclick="start('${S.mode}')">もう一回チャレンジ</button>
  <button class="btn ghost" onclick="home()">トップにもどる（交代はここから）</button>`;
  const txt=`【中1テスト対策・${modeName(S.mode)}】\n${S.names[S.player]}：${fmt(sc)}点／${full}点\n${rank}\n`+per.map(p=>`${p.s.name} ${fmt(p.v)}/20`).join("・")+
    (wrong.length?`\n\n▼まちがえた問題（${wrong.length}問）\n`+wrong.slice(0,30).map(l=>`・${l.q.subj.name}：${l.q.q.split("\n")[0]}（答え：${l.ans}）`).join("\n")+(wrong.length>30?"\n…ほか"+(wrong.length-30)+"問":""):"\n\n全問正解！🎯");
  $("linebtn").href="https://line.me/R/share?text="+encodeURIComponent(txt);
  window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
